image: plugins-master:latest

stages:
  - manual
  - test
  - deploy

test-pyright:
  image: registry.gitlab.com/gajim/gajim/test:latest
  stage: test
  allow_failure: true
  rules:
    - changes:
      - "**/*.py"
  script:
    - pip install git+https://gitlab.com/gajim/python-nbxmpp.git
    - pip install git+https://gitlab.com/gajim/gajim.git
    - pip install pygobject-stubs==2.16.0
    - pyright --version
    - pyright
  interruptible: true

test-ruff-lint:
  image: registry.gitlab.com/gajim/gajim/test:latest
  stage: test
  rules:
    - changes:
      - "**/*.py"
  script:
    - ruff --version
    - ruff check
  interruptible: true

test-ruff-format:
  image: registry.gitlab.com/gajim/gajim/test:latest
  stage: test
  rules:
    - changes:
      - "**/*.py"
  script:
    - ruff --version
    - ruff format --diff
  interruptible: true

deploy-plugins:
  image: registry.gitlab.com/gajim/gajim-plugins/deploy:latest
  stage: deploy
  script:
    - python .ci/deploy.py

build-docker-image:
  image: docker:29.9.1-cli-alpine3.24
  stage: manual
  rules:
    - if: '$DOCKER_IMAGE'
  tags:
    - docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  services:
    - docker:29.9.1-dind-alpine3.24
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $CI_REGISTRY/gajim/gajim-plugins/$DOCKER_IMAGE:latest docker/$DOCKER_IMAGE
    - docker push $CI_REGISTRY/gajim/gajim-plugins/$DOCKER_IMAGE:latest
